<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
<title>VR Phone Camera (Side-by-side)</title>
<style>
  html,body { height:100%; margin:0; background:#000; color:#fff; font-family:system-ui, -apple-system, sans-serif; }
  /* Use full viewport height to avoid mobile chrome resizing issues
    and stretch canvases so both eyes align exactly top-to-bottom */
  #container { width:100%; height:100vh; display:flex; align-items:stretch; justify-content:center; position:relative; overflow:hidden; gap:0; }
  .eyeCanvas { background:#000; display:block; width:50%; height:100%; }
  #controls {
      position: absolute; top:10px; left:10px; right:10px; display:flex; gap:8px; align-items:center;
      background:rgba(0,0,0,0.35); padding:8px; border-radius:8px;
      backdrop-filter: blur(4px);
  }
  /* floating menu */
  #menu {
    position: absolute; bottom:18px; left:50%; transform:translateX(-50%); z-index:55;
    background:rgba(0,0,0,0.6); color:#fff; padding:10px; border-radius:10px; display:none; gap:8px;
    flex-direction:row; align-items:center; backdrop-filter: blur(6px);
    max-width:92vw; flex-wrap:wrap; overflow:auto; gap:6px;
  }
  #menu label { display:flex; align-items:center; gap:6px; margin:0 6px; }
  .menu-btn { background:#222; border:1px solid #333; color:#fff; padding:6px 8px; border-radius:6px; cursor:pointer; }
  .menu-btn:active { transform:translateY(1px); }
  .focused { outline:2px solid #0af; }
  .btn { background:#111; color:#fff; border:1px solid #333; padding:8px 10px; border-radius:6px; cursor:pointer; }
  .btn:active { transform:translateY(1px); }
  label { font-size:13px; display:flex; gap:6px; align-items:center; color:#ddd; }
  input[type=range] { width:140px; }
  #hint { position:absolute; bottom:12px; left:12px; right:12px; text-align:center; font-size:13px; color:#ddd; }
  #video { display:none; }
  .ui { transition: opacity 300ms ease; opacity:0; pointer-events:none; }
  .ui.visible { opacity:1; pointer-events:auto; }
  /* centered gaze pointer + dwell ring */
  .gaze-pointer { position:fixed; left:50%; top:50%; transform:translate(-50%,-50%); z-index:60; pointer-events:none; }
  .gaze-ring { width:56px; height:56px; border-radius:50%; background:rgba(0,0,0,0.35); display:flex; align-items:center; justify-content:center; }
  .gaze-dot { width:10px; height:10px; border-radius:50%; background:rgba(255,255,255,0.95); }
  .gaze-progress { position:absolute; inset:0; border-radius:50%; display:none; }
</style>
</head>
<body>
  <div id="container">
    <canvas id="left" class="eyeCanvas"></canvas>
    <canvas id="right" class="eyeCanvas"></canvas>

    <div id="controls">
      <button id="startBtn" class="btn">Start Camera</button>
      <button id="flipBtn" class="btn">Flip Camera</button>
      <button id="fsBtn" class="btn">Fullscreen</button>
      <label>Eye sep <input id="sep" type="range" min="-0.4" max="0.4" step="0.002" value="0.2"> <span id="sepVal">0.20</span></label>
  <label>Zoom <input id="zoom" type="range" min="1" max="2" step="0.01" value="1"> <span id="zoomVal">1.00</span></label>
      <label><input id="mirror" type="checkbox"> Mirror</label>
    </div>

  <div id="hint">Put phone in VR headset. Use "Fullscreen" for best experience.</div>
    <div id="menu">
  <button id="menuToggle" class="menu-btn">Settings</button>
        <select id="deviceSelect" aria-label="Camera device"></select>
        <label>FPS <select id="fpsSelect"><option value="30">30</option><option value="60">60</option><option value="120">120</option></select></label>
  <label>Zoom <input id="zoomMenu" type="range" min="1" max="2" step="0.01" value="1"> <span id="zoomMenuVal">1.00</span></label>
  <label>Wide <input id="wideMode" type="checkbox"></label>
  <label>Align X <input id="alignX" type="range" min="-0.1" max="0.1" step="0.001" value="0"></label>
    </div>
    <!-- small overlay for permission hints -->
    <div id="permHint" class="ui" style="display:none; position:fixed; left:50%; top:20%; transform:translateX(-50%); background:rgba(0,0,0,0.75); padding:12px; border-radius:8px; z-index:80; max-width:90vw; text-align:center;">
      <div id="permMsg" style="font-size:14px; color:#fff; margin-bottom:8px;">Gyro permission is required. Grant Motion & Orientation access in the browser when prompted.</div>
      <button id="permDismiss" class="btn">Dismiss</button>
    </div>
  </div>

  <video id="video" autoplay playsinline muted></video>

  <!-- centered gaze pointer used for selection/dwell click -->
  <div class="gaze-pointer" id="gazePointer" aria-hidden="true">
    <div class="gaze-ring">
      <svg class="gaze-progress" viewBox="0 0 100 100">
        <circle cx="50" cy="50" r="45" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="8" />
        <circle id="gazeProgressCircle" cx="50" cy="50" r="45" fill="none" stroke="rgba(0,170,255,0.95)" stroke-width="8" stroke-dasharray="283" stroke-dashoffset="283" stroke-linecap="round" transform="rotate(-90 50 50)" />
      </svg>
      <div class="gaze-dot"></div>
    </div>
  </div>

  <script>
    const video = document.getElementById('video');
    const leftCanvas = document.getElementById('left');
    const rightCanvas = document.getElementById('right');
    const startBtn = document.getElementById('startBtn');
    const flipBtn = document.getElementById('flipBtn');
    const fsBtn = document.getElementById('fsBtn');
    const sepControl = document.getElementById('sep');
    const zoomControl = document.getElementById('zoom');
    const sepVal = document.getElementById('sepVal');
    const zoomVal = document.getElementById('zoomVal');
    const mirrorChk = document.getElementById('mirror');
    const container = document.getElementById('container');

    let stream = null;
    let usingFacingMode = 'environment';
    let rafId = null;
    let eyeSep = parseFloat(sepControl.value);
    let zoom = parseFloat(zoomControl.value);
    let mirror = false;

    // offscreen canvas used when rotating portrait video to landscape
    const rotCanvas = document.createElement('canvas');
    const rotCtx = rotCanvas.getContext('2d');

    function stopStream() {
      if (stream) {
        stream.getTracks().forEach(t => t.stop());
        stream = null;
      }
      if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
    }

    async function startCamera() {
      stopStream();
      try {
        const constraints = {
          audio: false,
          video: {
            facingMode: { ideal: usingFacingMode },
            width: { ideal: 1920 },
            height: { ideal: 1080 }
          }
        };
        stream = await navigator.mediaDevices.getUserMedia(constraints);
        video.srcObject = stream;
        await video.play();
        resizeCanvases();
        drawLoop();
      } catch (err) {
        alert('Camera error: ' + (err && err.message ? err.message : err));
        console.error(err);
      }
    }

    async function tryFlipCamera() {
      usingFacingMode = (usingFacingMode === 'environment') ? 'user' : 'environment';
      await startCamera();
    }

    function resizeCanvases() {
      const dpr = window.devicePixelRatio || 1;
      // Use the viewport size to avoid mobile chrome UI changing container size
      const w = window.innerWidth;
      const h = window.innerHeight;
      const eyeW = Math.floor(w / 2);

      // Set CSS size (layout) so canvases occupy exactly half the viewport each
      leftCanvas.style.width = eyeW + 'px';
      leftCanvas.style.height = h + 'px';
      rightCanvas.style.width = eyeW + 'px';
      rightCanvas.style.height = h + 'px';

      // Set internal canvas pixel size according to devicePixelRatio to avoid blurriness
      leftCanvas.width = Math.max(1, Math.floor(eyeW * dpr));
      leftCanvas.height = Math.max(1, Math.floor(h * dpr));
      rightCanvas.width = Math.max(1, Math.floor(eyeW * dpr));
      rightCanvas.height = Math.max(1, Math.floor(h * dpr));
    }

    window.addEventListener('resize', () => {
      resizeCanvases();
    });

    sepControl.addEventListener('input', (e) => {
      eyeSep = parseFloat(e.target.value) || 0;
      sepVal.textContent = eyeSep.toFixed(3);
    });
  // set initial display for sep control
  eyeSep = parseFloat(sepControl.value);
  sepVal.textContent = eyeSep.toFixed(3);
  // initialize zoom display values to match controls (ensure 1.00 default)
  zoom = parseFloat(zoomControl.value) || 1;
  zoomVal.textContent = zoom.toFixed(2);
  // zoomMenuVal will be initialized after menu elements are queried below

    zoomControl.addEventListener('input', (e) => {
      zoom = parseFloat(e.target.value) || 1;
      zoomVal.textContent = zoom.toFixed(2);
    });

    mirrorChk.addEventListener('change', (e) => {
      mirror = e.target.checked;
    });

    startBtn.addEventListener('click', startCamera);
    flipBtn.addEventListener('click', tryFlipCamera);
    fsBtn.addEventListener('click', () => {
      if (!document.fullscreenElement) {
        container.requestFullscreen?.();
      } else {
        document.exitFullscreen?.();
      }
    });

  // --- Menu, cursor, device picker, gyro and tap-to-click behavior ---
  const menu = document.getElementById('menu');
  const menuToggle = document.getElementById('menuToggle');
    const deviceSelect = document.getElementById('deviceSelect');
    const fpsSelect = document.getElementById('fpsSelect');
  const wideMode = document.getElementById('wideMode');

    // gaze pointer elements
    const gazePointer = document.getElementById('gazePointer');
    const gazeProgressCircle = document.getElementById('gazeProgressCircle');

    let gyroEnabled = false;
    let menuActive = false;
  // activation only happens on explicit tap/click; no auto-activation on focus
  // single align slider
  const alignX = document.getElementById('alignX');
  let alignOffset = parseFloat(alignX.value) || 0;
  // show/hide UI helpers (add .ui class to elements that should auto-hide)
  menu.classList.add('ui');
  document.getElementById('controls').classList.add('ui');
    // showUI now ensures the menu element is actually displayed (was display:none which prevented showing)
  function showUI() { menu.style.display = 'flex'; menu.classList.add('visible'); document.getElementById('controls').classList.add('visible'); }
  function hideUI() { menu.classList.remove('visible'); document.getElementById('controls').classList.remove('visible'); menu.style.display = 'none'; gyroEnabled = false; menuAnchor = null; if (focusEl) { focusEl.classList.remove('focused'); } focusEl = null; focusCandidate = null; focusStableCount = 0; }

    alignX.addEventListener('input', (e) => { alignOffset = parseFloat(e.target.value) || 0; });

    // menu zoom control sync with top zoom control
    const zoomMenu = document.getElementById('zoomMenu');
    const zoomMenuVal = document.getElementById('zoomMenuVal');
    zoomMenu.addEventListener('input', (e) => {
      const v = parseFloat(e.target.value) || 1; zoom = v; zoomVal.textContent = v.toFixed(2); zoomMenuVal.textContent = v.toFixed(2);
    });
    // keep both sliders in sync if top zoom changes
    zoomControl.addEventListener('input', (e) => { const v = parseFloat(e.target.value) || 1; zoomMenu.value = v; zoomMenuVal.textContent = v.toFixed(2); });
    // initialize menu zoom to current zoom
    zoomMenu.value = zoomControl.value; zoomMenuVal.textContent = parseFloat(zoomControl.value).toFixed(2);

    // last tap coords for anchored menu
    let lastTapX = window.innerWidth/2, lastTapY = window.innerHeight - 80;
    menuToggle.addEventListener('click', () => {
      menuActive = !menuActive;
      if (menuActive) showUI(); else hideUI();
    });

    // gaze-based selection: cursor stays centered (cursor drawn into canvases when menu is visible)

    // gaze point in screen coords computed from device orientation
    let gazeX = window.innerWidth / 2, gazeY = window.innerHeight / 2;
    // smoothing state for gyro (low-pass)
    let _g_lastGamma = 0, _g_lastBeta = 0;
    const _g_alpha = 0.12; // smoothing factor (0..1) lower = smoother
    function onDeviceOrientation(e) {
      if (!gyroEnabled) return;
      const gx = e.gamma || 0; const gy = e.beta || 0;
      // low-pass filter
      _g_lastGamma = _g_lastGamma * (1 - _g_alpha) + gx * _g_alpha;
      _g_lastBeta = _g_lastBeta * (1 - _g_alpha) + gy * _g_alpha;
      const sgx = _g_lastGamma, sgy = _g_lastBeta;
      // map smoothed angles to a screen-space gaze point
      gazeX = (window.innerWidth / 2) + (sgx / 90) * (window.innerWidth / 3);
      gazeY = (window.innerHeight / 2) + (sgy / 90) * (window.innerHeight / 3);
      gazeX = Math.max(0, Math.min(window.innerWidth, gazeX));
      gazeY = Math.max(0, Math.min(window.innerHeight, gazeY));

      // determine focused element under the gaze point (not always center)
      if (menuActive || gyroEnabled) {
        const cx = Math.round(gazeX), cy = Math.round(gazeY);
        const el = document.elementFromPoint(cx, cy);
        if (el && (menu.contains(el) || document.getElementById('controls').contains(el))) highlightFocus(el);
        else highlightFocus(null);
      }
      // show pointer when menu visible or gyro active
      if (menu.classList.contains('visible') || gyroEnabled) {
        gazePointer.style.display = 'block';
      } else {
        gazePointer.style.display = 'none';
      }
      // also update controls position when anchored
      if (menuActive && menuAnchor && menuAnchor.anchored) updateControlsAnchorPosition();
      // if we have a menu anchor in world angles, update DOM position so the menu stays anchored in world space
      if (menuActive && menuAnchor && menuAnchor.anchored) {
        updateMenuAnchorPosition();
      }
    }

    // menu anchor state (world angles or screen fallback)
    let menuAnchor = null;

    function updateMenuAnchorPosition() {
      if (!menuAnchor) return;
      // compute screen position for stored anchor angles
      if (typeof menuAnchor.gamma === 'number') {
        const sx = (window.innerWidth / 2) + (menuAnchor.gamma / 90) * (window.innerWidth / 3);
        const sy = (window.innerHeight / 2) + (menuAnchor.beta / 90) * (window.innerHeight / 3);
        // clamp into viewport
        const left = Math.max(8, Math.min(window.innerWidth - menu.offsetWidth - 8, sx - menu.offsetWidth / 2));
        const top = Math.max(8, Math.min(window.innerHeight - menu.offsetHeight - 8, sy - menu.offsetHeight / 2));
        menu.style.left = left + 'px';
        menu.style.top = top + 'px';
        menu.style.transform = 'none';
  // position top controls relative to the same anchor (above the menu)
  updateControlsAnchorPosition();
      } else if (menuAnchor.screenX != null) {
        // fallback: keep fixed screen position
        menu.style.left = Math.max(8, Math.min(window.innerWidth - menu.offsetWidth - 8, menuAnchor.screenX - menu.offsetWidth/2)) + 'px';
        menu.style.top = Math.max(8, Math.min(window.innerHeight - menu.offsetHeight - 8, menuAnchor.screenY - menu.offsetHeight/2)) + 'px';
        menu.style.transform = 'none';
      }
    }

    function updateControlsAnchorPosition() {
      // place the controls above the anchored point in world space
      if (!menuAnchor) return;
      // compute screen position for stored anchor angles or fallback to screenX
      let sx, sy;
      if (typeof menuAnchor.gamma === 'number') {
        sx = (window.innerWidth / 2) + (menuAnchor.gamma / 90) * (window.innerWidth / 3);
        sy = (window.innerHeight / 2) + (menuAnchor.beta / 90) * (window.innerHeight / 3);
      } else if (menuAnchor.screenX != null) {
        sx = menuAnchor.screenX; sy = menuAnchor.screenY;
      } else return;
      // offset controls upward so they appear at the top relative to anchor
      const controlsEl = document.getElementById('controls');
      const cw = controlsEl.offsetWidth || (window.innerWidth - 20);
      const ch = controlsEl.offsetHeight || 48;
      const offsetY = Math.max(80, window.innerHeight * 0.28);
      const left = Math.max(8, Math.min(window.innerWidth - cw - 8, sx - cw / 2));
      const top = Math.max(8, Math.min(window.innerHeight - ch - 8, sy - offsetY - ch / 2));
      controlsEl.style.left = left + 'px';
      controlsEl.style.top = top + 'px';
      controlsEl.style.right = 'auto';
      controlsEl.style.transform = 'none';
    }

    // focus highlighting (no auto-click). Selection happens only on explicit tap/click.
    let focusEl = null;
    let focusCandidate = null;
    let focusStableCount = 0;
  function highlightFocus(el) {
      // simple stability: require same element for 2 frames
      if (focusCandidate !== el) { focusCandidate = el; focusStableCount = 0; }
      focusStableCount++;
      if (focusStableCount < 2) return;
      if (focusEl === el) return;
      if (focusEl) focusEl.classList.remove('focused');
      focusEl = el;
      if (focusEl) focusEl.classList.add('focused'); else lastActivatedEl = null;
    }
    // immediate activation; dwell/progress ring disabled

    // Touch to open menu or to click focused element when menu is open (YouTube VR style)
    window.addEventListener('touchstart', (ev) => {
      const t = ev.touches && ev.touches[0];
      if (t) { lastTapX = t.clientX; lastTapY = t.clientY; }
      if (!menuActive) {
        menuActive = true;
        // establish screen anchor first
        menuAnchor = { anchored: true, screenX: lastTapX, screenY: lastTapY };
        showUIAt(lastTapX, lastTapY);
        // try to enable gyro so the menu can be anchored in world-space
        tryEnableGyro().then(ok => { if (ok) enableGyro(); });
      }
      else {
        // if focused element is in menu/controls and menu active, click it
        if (focusEl && (menu.contains(focusEl) || document.getElementById('controls').contains(focusEl))) {
          focusEl.click();
        } else {
          // tapped an empty area: close menu immediately and return to camera-only view
          menuActive = false; hideUI();
        }
      }
    }, { passive: true });

    // Same for mouse - open anchored at click position; detect double-click to toggle gyro while menu is open
    let _lastClick = 0;
    window.addEventListener('click', async (ev) => {
      const now = Date.now();
      const dt = now - _lastClick; _lastClick = now;
      // double-click (within 400ms) toggles gyro when menu is open
      if (dt > 0 && dt < 400 && menuActive) {
        if (!gyroEnabled) await enableGyro(); else disableGyro();
        return;
      }
      lastTapX = ev.clientX; lastTapY = ev.clientY;
      if (!menuActive) {
        menuActive = true;
        // establish screen anchor and show
        menuAnchor = { anchored: true, screenX: lastTapX, screenY: lastTapY };
        showUIAt(lastTapX, lastTapY);
        // request gyro permission and enable if granted so the anchor follows head movement
        tryEnableGyro().then(ok => { if (ok) enableGyro(); });
        // show pointer when menu opens
        gazePointer.style.display = 'block';
      }
      else {
        if (focusEl && (menu.contains(focusEl) || document.getElementById('controls').contains(focusEl))) {
          focusEl.click();
        } else {
          // clicked empty area while menu open: close menu immediately
          menuActive = false; hideUI();
        }
      }
    });

    // gyro toggle removed; menu now requests gyro when opened

    // permission hint overlay
    const permHint = document.getElementById('permHint');
    const permMsg = document.getElementById('permMsg');
    document.getElementById('permDismiss').addEventListener('click', () => { permHint.style.display = 'none'; permHint.classList.remove('visible'); });

    // enable / disable gyro helpers
    async function enableGyro() {
      if (!menuActive) { alert('Open the menu first to enable gyro control'); return false; }
      if (menuTimeout) { clearTimeout(menuTimeout); menuTimeout = null; }
      if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
        try {
          const res = await DeviceOrientationEvent.requestPermission();
          if (res !== 'granted') { permMsg.textContent = 'Gyro permission denied — open browser settings to enable Motion & Orientation access for this page.'; permHint.style.display = 'block'; permHint.classList.add('visible'); return false; }
        } catch (err) { permMsg.textContent = 'Gyro permission error — your browser blocked motion access.'; permHint.style.display = 'block'; permHint.classList.add('visible'); return false; }
      }
      gyroEnabled = true;
      window.addEventListener('deviceorientation', onDeviceOrientation);
      // convert screen anchor to angle anchor if needed
      if (menuActive && menuAnchor && menuAnchor.screenX != null) {
        const centerX = window.innerWidth/2, centerY = window.innerHeight/2;
        const relX = menuAnchor.screenX - centerX; const relY = menuAnchor.screenY - centerY;
        menuAnchor.gamma = (relX / (window.innerWidth/3)) * 90; menuAnchor.beta = (relY / (window.innerHeight/3)) * 90;
      }
      return true;
    }

    function disableGyro() {
      gyroEnabled = false;
      window.removeEventListener('deviceorientation', onDeviceOrientation);
      scheduleMenuHide();
    }

    // wrap permission request to show friendly hint on denial
    async function tryEnableGyro() {
      if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
        try {
          const res = await DeviceOrientationEvent.requestPermission();
          if (res !== 'granted') { permMsg.textContent = 'Gyro permission denied — open browser settings to enable Motion & Orientation access for this page.'; permHint.style.display = 'block'; permHint.classList.add('visible'); return false; }
          return true;
        } catch (err) { permMsg.textContent = 'Gyro permission error — your browser blocked motion access.'; permHint.style.display = 'block'; permHint.classList.add('visible'); return false; }
      }
      return true;
    }

  // initialize menu hidden; the canvas cursor is drawn into canvases when menu is visible
  menu.style.display = 'none'; gyroEnabled = false;

    // menu auto-hide timer - disabled by default; menu stays until explicit outside tap
    let menuTimeout = null;
    function scheduleMenuHide() {
      // intentionally empty: we don't auto-hide the menu anymore. Keep function for compatibility.
    }

  // show menu anchored at screen coords (x,y)
  function showUIAt(x,y) {
      // position menu so its center is near the tap point but keep it inside viewport
      const mw = Math.min(window.innerWidth * 0.92, 480);
      const mh = 120;
      const left = Math.max(8, Math.min(window.innerWidth - mw - 8, x - mw/2));
      const top = Math.max(8, Math.min(window.innerHeight - mh - 8, y - mh/2));
      menu.style.left = left + 'px';
      menu.style.bottom = 'auto';
      menu.style.top = top + 'px';
      // when anchored we remove the translateX(-50%) so left is absolute
      menu.style.transform = 'none';
  menu.style.display = 'flex';
  menu.classList.add('visible');
  document.getElementById('controls').classList.add('visible');
    }

    // ensure showUI (centered) resets transform so menu centers with translateX
    function showUI() { menu.style.transform = 'translateX(-50%)'; menu.style.left = '50%'; menu.style.top = 'auto'; menu.style.bottom = '18px'; menu.style.display = 'flex'; menu.classList.add('visible'); document.getElementById('controls').classList.add('visible'); scheduleMenuHide(); }
    // hideUI already exists earlier and will hide menu


    async function enumerateCameras() {
      try {
        const devices = await navigator.mediaDevices.enumerateDevices();
        const cams = devices.filter(d => d.kind === 'videoinput');
        deviceSelect.innerHTML = '';
        cams.forEach(c => {
          const opt = document.createElement('option'); opt.value = c.deviceId; opt.textContent = c.label || c.deviceId;
          deviceSelect.appendChild(opt);
        });
      } catch (err) { console.warn('enumerateDevices failed', err); }
    }
    enumerateCameras();

    deviceSelect.addEventListener('change', async (e) => {
      const deviceId = e.target.value; if (!deviceId) return;
      stopStream();
      try {
        const constraints = { video: { deviceId: { exact: deviceId }, width: { ideal: 1920 }, height: { ideal: 1080 }, frameRate: { ideal: parseInt(fpsSelect.value,10) } } };
        stream = await navigator.mediaDevices.getUserMedia(constraints);
        video.srcObject = stream; await video.play(); resizeCanvases();
      } catch (err) { console.error('device select error', err); }
    });

    fpsSelect.addEventListener('change', async () => {
      const desired = parseInt(fpsSelect.value, 10);
      if (stream) {
        const track = stream.getVideoTracks()[0];
        if (track && track.applyConstraints) {
          try { await track.applyConstraints({ frameRate: { ideal: desired, max: desired } }); }
          catch (err) { console.warn('applyConstraints frameRate failed', err); }
        }
      }
    });

    wideMode.addEventListener('change', async (e) => {
      const wantWide = e.target.checked;
      if (!stream) return;
      // Prefer switching to a physical wide-angle camera (if enumerated and labeled accordingly).
      try {
        const devices = await navigator.mediaDevices.enumerateDevices();
        const cams = devices.filter(d => d.kind === 'videoinput');
        const wideCandidate = cams.find(c => /wide|ultra|ultrawide|0.5x/i.test(c.label));
        if (wantWide && wideCandidate) {
          // restart stream using the wide camera deviceId
          stopStream();
          const constraints = { video: { deviceId: { exact: wideCandidate.deviceId }, width: { ideal: 1920 }, height: { ideal: 1080 } } };
          stream = await navigator.mediaDevices.getUserMedia(constraints);
          video.srcObject = stream; await video.play(); resizeCanvases();
          return;
        }
      } catch (err) { console.warn('wideMode device search failed', err); }
      // Fallback: try applyConstraints zoom if the track supports it
      const track = stream.getVideoTracks()[0]; if (!track) return;
      const capabilities = track.getCapabilities ? track.getCapabilities() : {};
      const settings = {};
      if (capabilities.zoom) {
        const zmin = capabilities.zoom.min || 1; const zmax = capabilities.zoom.max || 1;
        settings.advanced = [{ zoom: wantWide ? zmin : Math.min(zmax, zmin + (zmax - zmin) / 2) }];
      }
      try { await track.applyConstraints(settings); }
      catch (err) {
        console.warn('wideMode applyConstraints failed', err);
        // revert checkbox if it failed
        wideMode.checked = !wantWide;
        alert('Wide mode not supported on this device/browser');
      }
    });

    // helper to draw video (or rotated video) onto an offscreen rotated canvas
    function ensureRotated(svw, svh) {
      // if portrait (height > width) we'll rotate into rotCanvas so that the image is landscape
      const shouldRotate = svh > svw;
      if (!shouldRotate) return { src: video, w: svw, h: svh, rotated: false };

      // rotCanvas size: swapped
      if (rotCanvas.width !== svh || rotCanvas.height !== svw) {
        rotCanvas.width = svh;
        rotCanvas.height = svw;
      }
      rotCtx.save();
      rotCtx.clearRect(0,0,rotCanvas.width, rotCanvas.height);
      // rotate 90deg clockwise so portrait becomes landscape
      rotCtx.translate(rotCanvas.width, 0);
      rotCtx.rotate(Math.PI / 2);
      rotCtx.drawImage(video, 0, 0, svw, svh);
      rotCtx.restore();
      return { src: rotCanvas, w: rotCanvas.width, h: rotCanvas.height, rotated: true };
    }

    function drawLoop() {
      const ctxL = leftCanvas.getContext('2d');
      const ctxR = rightCanvas.getContext('2d');

      function frame() {
        if (!video.videoWidth) {
          rafId = requestAnimationFrame(frame);
          return;
        }

        const lw = leftCanvas.width;
        const lh = leftCanvas.height;
        const rw = rightCanvas.width;
        const rh = rightCanvas.height;

        const svw = video.videoWidth;
        const svh = video.videoHeight;

        const rotatedSource = ensureRotated(svw, svh);
        const src = rotatedSource.src;
        const srcW = rotatedSource.w;
        const srcH = rotatedSource.h;

        // scale based on zoom (zoom >1 means zoom in -> crop smaller area)
        const scale = 1 / Math.max(zoom, 1);
        let tW = Math.max(1, srcW * scale);
        let tH = Math.max(1, srcH * scale);

        // destination aspect -> use leftCanvas aspect (both canvases share same size)
        const destAspect = (lw) / (lh);
        if (tW / tH > destAspect) {
          tW = tH * destAspect;
        } else {
          tH = tW / destAspect;
        }

        const sxc = (srcW - tW) / 2;
        const syc = (srcH - tH) / 2;

  const sepPx = eyeSep * tW; // eyeSep is fraction of crop width

  // apply alignOffset (same for both eyes) in fractions of crop width
  const alignPx = alignOffset * tW;
  const sxL = Math.max(0, Math.min(srcW - tW, sxc - sepPx * 0.5 + alignPx));
  const sxR = Math.max(0, Math.min(srcW - tW, sxc + sepPx * 0.5 + alignPx));
        const sy = Math.max(0, Math.min(srcH - tH, syc));

        // draw options: mirror by transforming canvas
        ctxL.save(); ctxR.save();
        if (mirror) {
          ctxL.translate(lw, 0); ctxL.scale(-1,1);
          ctxR.translate(rw, 0); ctxR.scale(-1,1);
        }

        ctxL.clearRect(0,0,lw,lh);
        ctxR.clearRect(0,0,rw,rh);

        // drawImage(source, sx, sy, sw, sh, dx, dy, dw, dh)
        ctxL.drawImage(src, sxL, sy, tW, tH, 0, 0, lw, lh);
        ctxR.drawImage(src, sxR, sy, tW, tH, 0, 0, rw, rh);

            // draw centered cursors visible in both eyes when UI is active, and draw gyro reticle when gyro active
                const radius = Math.max(6, Math.min(14, Math.floor(lw * 0.012)));
                if (menu.classList.contains('visible')) {
                  // compute cursor separation in pixels based on current tW crop
                  const sepPx = eyeSep * tW;
                  const alignPx = alignOffset * tW;
                  // For each eye canvas, position the dot relative to the canvas center but offset horizontally
                  // so the two dots match the stereo separation users see.
                  // compute calibration cursor positions so they correspond to the same source point
                  const centerLx = lw / 2 + (sepPx * 0.5) * (lw / tW) - (alignPx * (lw / tW));
                  const centerRx = rw / 2 - (sepPx * 0.5) * (rw / tW) - (alignPx * (rw / tW));
                  const centerY = lh / 2;
                  ctxL.fillStyle = 'rgba(255,255,255,0.95)'; ctxL.beginPath(); ctxL.arc(centerLx, centerY, radius, 0, Math.PI * 2); ctxL.fill();
                  ctxR.fillStyle = 'rgba(255,255,255,0.95)'; ctxR.beginPath(); ctxR.arc(centerRx, centerY, radius, 0, Math.PI * 2); ctxR.fill();
                }
                // draw gyro reticle mapped from screen gaze to each canvas
                if (gyroEnabled) {
                  // map gazeX/gazeY (screen coordinate) into each canvas pixel coordinate
                  const leftRect = leftCanvas.getBoundingClientRect();
                  const rightRect = rightCanvas.getBoundingClientRect();
                  // normalize to canvas pixel coordinates
                  const gxL = (gazeX - leftRect.left) * (leftCanvas.width / leftRect.width);
                  const gyL = (gazeY - leftRect.top) * (leftCanvas.height / leftRect.height);
                  const gxR = (gazeX - rightRect.left) * (rightCanvas.width / rightRect.width);
                  const gyR = (gazeY - rightRect.top) * (rightCanvas.height / rightRect.height);
                  // draw small ring
                  ctxL.strokeStyle = 'rgba(0,170,255,0.95)'; ctxL.lineWidth = Math.max(2, Math.floor(lw * 0.002)); ctxL.beginPath(); ctxL.arc(gxL, gyL, radius+2, 0, Math.PI*2); ctxL.stroke();
                  ctxR.strokeStyle = 'rgba(0,170,255,0.95)'; ctxR.lineWidth = Math.max(2, Math.floor(rw * 0.002)); ctxR.beginPath(); ctxR.arc(gxR, gyR, radius+2, 0, Math.PI*2); ctxR.stroke();
                  // draw small anchor marker where the menu is anchored (if visible and anchored)
                  if (menu.classList.contains('visible') && menu.style.transform === 'none') {
                    const mLeft = parseFloat(menu.style.left || '0');
                    const mTop = parseFloat(menu.style.top || '0');
                    // map menu anchor to each canvas if within the canvas rect
                    const lRect = leftCanvas.getBoundingClientRect();
                    const rRect = rightCanvas.getBoundingClientRect();
                    const anchorX = mLeft + (menu.offsetWidth/2);
                    const anchorY = mTop + (menu.offsetHeight/2);
                    const axL = (anchorX - lRect.left) * (leftCanvas.width / lRect.width);
                    const ayL = (anchorY - lRect.top) * (leftCanvas.height / lRect.height);
                    const axR = (anchorX - rRect.left) * (rightCanvas.width / rRect.width);
                    const ayR = (anchorY - rRect.top) * (rightCanvas.height / rRect.height);
                    ctxL.strokeStyle = 'rgba(255,200,0,0.9)'; ctxL.beginPath(); ctxL.arc(axL, ayL, radius+6, 0, Math.PI*2); ctxL.stroke();
                    ctxR.strokeStyle = 'rgba(255,200,0,0.9)'; ctxR.beginPath(); ctxR.arc(axR, ayR, radius+6, 0, Math.PI*2); ctxR.stroke();
                  }
                }

        ctxL.restore(); ctxR.restore();

        rafId = requestAnimationFrame(frame);
      }

      frame();
    }

    // Clean up on page hide
    window.addEventListener('pagehide', stopStream);
    window.addEventListener('beforeunload', stopStream);

    // Auto-start if permissions already granted (optional): try to enumerate and pick camera
    // We'll leave control to user to press "Start Camera" to avoid autoplay / permission prompts.
  </script>
